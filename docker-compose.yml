version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: mynaukri_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: MyNaukri.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=mynaukri_db;Username=postgres;Password=postgres123
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
    ports:
      - "3000:80"

volumes:
  pgdata:
